services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/budget_planner
      DB_USERNAME: budget_user
      DB_PASSWORD: ${DB_PASSWORD:-budget_password}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/actuator/health']
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 12

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: budget_planner
      POSTGRES_USER: budget_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-budget_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'budget_user', '-d', 'budget_planner']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
