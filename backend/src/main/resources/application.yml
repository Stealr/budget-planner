server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: budget-planner
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/budget_planner}
    username: ${DB_USERNAME:budget_user}
    password: ${DB_PASSWORD:budget_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
