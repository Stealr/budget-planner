databaseChangeLog:
  - changeSet:
      id: 005-add-category-catalog-and-archive
      author: budget-planner
      changes:
        - addColumn:
            tableName: categories
            columns:
              - column:
                  name: standard_code
                  type: VARCHAR(32)
                  constraints:
                    unique: true
                    uniqueConstraintName: uq_categories_standard_code
              - column:
                  name: archived_at
                  type: TIMESTAMP WITH TIME ZONE
