databaseChangeLog:
  - changeSet:
      id: 001-create-categories
      author: budget-planner
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_categories
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - sql:
            sql: >-
              ALTER TABLE categories ADD CONSTRAINT chk_category_type
              CHECK (type IN ('INCOME', 'EXPENSE'))
        - sql:
            sql: >-
              ALTER TABLE categories ADD CONSTRAINT chk_category_name
              CHECK (LENGTH(TRIM(name)) > 0)
