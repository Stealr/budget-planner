databaseChangeLog:
  - changeSet:
      id: 009-create-recurring-payments
      author: budget-planner
      changes:
        - createTable:
            tableName: recurring_payments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: owner_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: day_of_month
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: reminders_enabled
                  type: BOOLEAN
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: recurring_payments
            baseColumnNames: owner_id
            referencedTableName: user_accounts
            referencedColumnNames: id
            constraintName: fk_recurring_payments_owner
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: recurring_payments
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_recurring_payments_category
            onDelete: RESTRICT
        - createIndex:
            tableName: recurring_payments
            indexName: idx_recurring_payments_owner
            columns:
              - column:
                  name: owner_id
        - createIndex:
            tableName: recurring_payments
            indexName: idx_recurring_payments_category
            columns:
              - column:
                  name: category_id
        - createTable:
            tableName: recurring_payment_confirmations
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: payment_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: month_start
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: due_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: transaction_id
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: recurring_payment_confirmations
            baseColumnNames: payment_id
            referencedTableName: recurring_payments
            referencedColumnNames: id
            constraintName: fk_recurring_confirmations_payment
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: recurring_payment_confirmations
            baseColumnNames: transaction_id
            referencedTableName: transactions
            referencedColumnNames: id
            constraintName: fk_recurring_confirmations_transaction
            onDelete: SET NULL
        - addUniqueConstraint:
            tableName: recurring_payment_confirmations
            columnNames: payment_id, month_start
            constraintName: uq_recurring_confirmations_payment_month
        - createIndex:
            tableName: recurring_payment_confirmations
            indexName: idx_recurring_confirmations_transaction
            columns:
              - column:
                  name: transaction_id
