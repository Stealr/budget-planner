databaseChangeLog:
  - changeSet:
      id: 008-create-savings-goals
      author: budget-planner
      changes:
        - createTable:
            tableName: savings_goals
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: owner_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: target_amount
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: due_date
                  type: DATE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: savings_goals
            baseColumnNames: owner_id
            referencedTableName: user_accounts
            referencedColumnNames: id
            constraintName: fk_savings_goals_owner
            onDelete: CASCADE
        - createIndex:
            tableName: savings_goals
            indexName: idx_savings_goals_owner_due
            columns:
              - column:
                  name: owner_id
              - column:
                  name: due_date
        - createTable:
            tableName: goal_contributions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: goal_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: request_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: contribution_date
                  type: DATE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: goal_contributions
            baseColumnNames: goal_id
            referencedTableName: savings_goals
            referencedColumnNames: id
            constraintName: fk_goal_contributions_goal
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: goal_contributions
            columnNames: goal_id, request_id
            constraintName: uq_goal_contributions_goal_request
        - createIndex:
            tableName: goal_contributions
            indexName: idx_goal_contributions_goal_date
            columns:
              - column:
                  name: goal_id
              - column:
                  name: contribution_date
