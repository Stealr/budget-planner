databaseChangeLog:
  - changeSet:
      id: 002-create-transactions
      author: budget-planner
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_transactions
                    nullable: false
              - column:
                  name: amount
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(500)
              - column:
                  name: transaction_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_transaction_category
            onDelete: RESTRICT
        - sql:
            sql: >-
              ALTER TABLE transactions ADD CONSTRAINT chk_transaction_amount
              CHECK (amount > 0)
        - sql:
            sql: >-
              ALTER TABLE transactions ADD CONSTRAINT chk_transaction_type
              CHECK (type IN ('INCOME', 'EXPENSE'))
        - createIndex:
            tableName: transactions
            indexName: idx_transactions_category_id
            columns:
              - column:
                  name: category_id
        - createIndex:
            tableName: transactions
            indexName: idx_transactions_date
            columns:
              - column:
                  name: transaction_date
        - createIndex:
            tableName: transactions
            indexName: idx_transactions_type_date
            columns:
              - column:
                  name: type
              - column:
                  name: transaction_date
